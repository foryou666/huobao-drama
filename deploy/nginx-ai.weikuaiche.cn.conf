# ai.weikuaiche.cn — HTTPS 终止，反代到本机 Node (5679)
server {
    listen 80;
    server_name ai.weikuaiche.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.weikuaiche.cn;

    ssl_certificate     /etc/nginx/ssl/ai.weikuaiche.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/ai.weikuaiche.cn.key;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
