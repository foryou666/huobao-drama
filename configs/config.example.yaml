app:
  name: "红果短剧 API"
  version: "1.0.0"
  debug: true
  language: "zh" # 系统语言：zh(中文) 或 en(英文)

server:
  port: 5678
  host: "0.0.0.0"
  cors_origins:
    - "http://localhost:3012"
  read_timeout: 600
  write_timeout: 600

database:
  type: "sqlite"
  path: "./data/huobao_drama.db"
  max_idle: 10
  max_open: 100

storage:
  type: "local"
  local_path: "./data/storage"
  base_url: "http://localhost:5678/static"
  # 第三方视频接口（橙盟等）需公网图片 URL，本地 static/ 会自动上传 OSS
  oss:
    bucket: "llingjingmanju"
    region: "oss-cn-qingdao"
    public_base_url: "https://llingjingmanju.oss-cn-qingdao.aliyuncs.com"
    key_prefix: "hongguoduanju"
    # 凭证请写在 backend/.env（勿提交 git）
    # access_key_id: ""
    # access_key_secret: ""

ai:
  default_text_provider: "openai"
  default_image_provider: "openai"
  default_video_provider: "doubao"
